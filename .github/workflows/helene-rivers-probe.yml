name: Helene river data probe
# One-off check of which river datasets exist for Helene (flow direction and volumes).
# Runs only on the river-data-probe branch and commits its findings there, so main is untouched.
on:
  workflow_dispatch:
  push:
    branches: [river-data-probe]
    paths:
      - scripts/probe_helene_rivers.py
      - .github/workflows/helene-rivers-probe.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy netCDF4
      - run: python scripts/probe_helene_rivers.py
      - name: Commit the findings
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/rivers-probe || true
          git diff --cached --quiet && echo "No change" || (git commit -m "River data probe results" && git push)
