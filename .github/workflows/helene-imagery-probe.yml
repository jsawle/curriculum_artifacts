name: Helene imagery probe
# One-off check of post-Helene imagery and damage layers; runs only on the imagery-probe branch.
on:
  push:
    branches: [imagery-probe]
    paths: [scripts/probe_helene_imagery.py, .github/workflows/helene-imagery-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: python scripts/probe_helene_imagery.py
      - name: Commit the findings
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/imagery-probe || true
          git diff --cached --quiet && echo "No change" || (git commit -m "Imagery probe results" && git push)
