name: Subduction earthquakes snapshot
# Fetches the earthquakes used by subduction-lab-test.html and saves them in data/subduction/,
# so the page loads one small file instead of a slow 5-year USGS query per student. Refreshed monthly.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *"
  push:
    paths:
      - scripts/fetch_subduction_quakes.py
      - .github/workflows/subduction-quakes.yml
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_subduction_quakes.py
      - name: Commit the data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/subduction/
          git diff --cached --quiet && echo "No change" || (git commit -m "Update subduction earthquakes snapshot" && git push)
