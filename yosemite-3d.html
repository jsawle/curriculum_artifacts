<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yosemite Valley in 3D: filled with ice</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#F3F4F0;--ink:#22302F;--ink-2:#5C6866;--rule:#C9CEC8;--water:#2F6F8F;--panel:400px}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.5}
  #app{display:grid;grid-template-columns:var(--panel) minmax(0,1fr);height:100vh}
  #panel{display:flex;flex-direction:column;gap:10px;padding:14px 18px 12px;border-right:1px solid var(--ink);overflow:hidden;min-height:0}
  h1{font-size:19px;font-weight:600;margin:0;line-height:1.2}
  .lede{margin:-6px 0 0;color:var(--ink-2);font-size:12.5px}
  .stages{list-style:none;margin:0;padding:0;position:relative}
  .stages::before{content:"";position:absolute;left:11px;top:12px;bottom:12px;width:1px;background:var(--ink)}
  .stages li{margin:0 0 2px}
  .stages button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;padding:4px 8px 4px 4px;border:1px solid transparent;border-radius:3px;background:transparent;color:var(--ink);cursor:pointer;position:relative}
  .stages button:hover{background:#E6E9E4;border-color:var(--rule)}
  .stages button:focus-visible{outline:2px solid var(--water);outline-offset:1px}
  .stages .dot{flex:none;width:13px;height:13px;border-radius:50%;background:var(--paper);border:1.5px solid var(--ink);position:relative;z-index:1}
  .stages .t{display:flex;align-items:baseline;gap:8px;line-height:1.3}
  .stages b{font-weight:600;font-size:14px}.stages small{font-size:12px;color:var(--ink-2)}
  .stages button::after{content:"›";margin-left:auto;font-size:18px;color:var(--ink-2);line-height:1}
  .stages button[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .stages button[aria-current="true"] .dot{background:var(--paper)}
  .stages button[aria-current="true"] small,.stages button[aria-current="true"]::after{color:#C9CEC8}
  .info{border-top:1px solid var(--rule);padding-top:10px;flex:1 1 auto;min-height:0;overflow-y:auto}
  h2{font-size:16px;font-weight:600;margin:0 0 4px}
  .info p{margin:0 0 6px;font-size:14.5px}
  .info p a{color:var(--water)}
  .look{border-left:2px solid var(--water);padding:0 0 0 12px;margin-top:8px}
  .look h3{font-size:13px;font-weight:600;margin:0 0 4px;color:var(--water)}
  .look ul{margin:0;padding-left:16px}.look li{font-size:13px;margin-bottom:3px}
  .links{flex:none;padding-top:10px;border-top:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .links a{font-size:13.5px;text-decoration:none;padding:7px 12px;border-radius:2px;border:1px solid var(--water);color:var(--water)}
  .links a.primary{background:var(--water);color:#fff}
  .links span{font-size:11.5px;color:var(--ink-2);flex-basis:100%}
  #view{position:relative;background:#E4E9EA;overflow:hidden;min-height:0}
  canvas.gl{display:block;width:100%;height:100%}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink-2);font-size:15px;background:#E4E9EA;z-index:5}
  .chip{position:absolute;font-size:11.5px;color:var(--ink-2);background:rgba(243,244,240,.88);padding:4px 8px;border-radius:2px}
  #hint{left:12px;bottom:10px;max-width:70%}
  #inset{position:absolute;left:12px;top:12px;display:flex;gap:6px;background:rgba(243,244,240,.92);padding:6px;border:1px solid var(--rule);border-radius:2px}
  #inset .m{position:relative;width:110px;height:110px;overflow:hidden;background:#dde}
  #inset .m img{position:absolute;inset:0;width:100%;height:100%;display:block}
  #inset .dot{position:absolute;width:10px;height:10px;border-radius:50%;background:#C8452B;border:2px solid #fff;transform:translate(-50%,-50%);box-shadow:0 0 0 1px #C8452B}
  #inset .cap{position:absolute;left:0;right:0;bottom:0;font-size:9px;color:#fff;background:rgba(34,48,47,.6);padding:1px 3px;line-height:1.2}
  #plan{width:132px;height:110px;display:block;background:#cfd3cc}
  #north{position:absolute;right:12px;bottom:12px;width:44px;height:44px}
  @media (max-width:800px){#app{grid-template-columns:1fr;grid-template-rows:52vh minmax(0,1fr);height:100vh}#view{order:-1}#panel{border-right:0;border-top:1px solid var(--ink)}#inset{transform:scale(.7);transform-origin:top left}}
</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <h1>Yosemite Valley, filled with ice</h1>
    <p class="lede">Real terrain and satellite imagery. Drag the model to turn it, scroll or pinch to zoom.</p>
    <ol class="stages" aria-label="Stages: choose one">
      <li><button data-s="0"><span class="dot"></span><span class="t"><b>Before the ice</b><small>over 2,000,000 BP</small></span></button></li>
      <li><button data-s="1"><span class="dot"></span><span class="t"><b>Sherwin glaciation</b><small>about 1,000,000 BP</small></span></button></li>
      <li><button data-s="2"><span class="dot"></span><span class="t"><b>Tioga glaciation</b><small>about 20,000 BP</small></span></button></li>
      <li><button data-s="3"><span class="dot"></span><span class="t"><b>Lake Yosemite</b><small>about 15,000 BP</small></span></button></li>
      <li><button data-s="4" aria-current="true"><span class="dot"></span><span class="t"><b>Today</b><small>0 BP</small></span></button></li>
    </ol>
    <div class="info">
      <h2 id="title"></h2><p id="b1"></p><p id="b2"></p>
      <div class="look"><h3>Look for this in MapMaker</h3><ul id="look"></ul></div>
    </div>
    <div class="links">
      <a class="primary" href="https://www.arcgis.com/apps/instant/atlas/index.html?appid=0cd1cdee853c413a84bfe4b9a6931f0d&center=-119.6350,37.7250&level=13" target="_blank" rel="noopener">Open in MapMaker</a>
      <a id="xsLink" href="yosemite-valley.html">Cross-section</a>
      <span>BP = years before now.</span>
    </div>
  </aside>
  <div id="view">
    <div id="loading">Loading terrain…</div>
    <div id="inset">
      <div class="m"><img id="insetImg" alt="Location map: Yosemite Valley in eastern California"><div class="dot" id="insetDot"></div><div class="cap">Yosemite, California. Map: Esri</div></div>
      <canvas id="plan" width="264" height="220" aria-label="Plan view of the model showing the camera position"></canvas>
    </div>
    <div id="hint" class="chip">Heights ×1.5. <span id="attrib"></span></div>
    <svg id="north" viewBox="0 0 44 44" aria-label="North arrow"><circle cx="22" cy="22" r="20" fill="rgba(243,244,240,.88)" stroke="#5C6866"/><g id="northG"><path d="M22 5 L27 22 L22 19 L17 22 Z" fill="#22302F"/><text x="22" y="36" text-anchor="middle" font-size="11" fill="#22302F">N</text></g></svg>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lerc@4.0.4/LercDecode.min.js"></script>
<script>
(async function(){
  // ---------- study area and elevation source ----------
  const BBOX={w:-119.725,e:-119.505,s:37.690,n:37.790};
  const qs=new URLSearchParams(location.search);
  const Z=+(qs.get('z')||13), STEP=+(qs.get('res')||3), EXAG=1.5, U=100;   // ?z=12&res=3 for a lighter mesh
  const DEM=qs.get('dem')||'esri';   // esri = World Elevation Terrain3D (LERC); terrarium = AWS PNG fallback
  const ESRI_DEM=(z,x,y)=>`https://elevation3d.arcgis.com/arcgis/rest/services/WorldElevation3D/Terrain3D/ImageServer/tile/${z}/${y}/${x}`;
  const TERRARIUM=(z,x,y)=>`https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${z}/${x}/${y}.png`;
  const IMG_Z=14, IMAGERY=(z,x,y)=>`https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`;
  const lon2x=(lon,z)=>(lon+180)/360*Math.pow(2,z);
  const lat2y=(lat,z)=>{const r=lat*Math.PI/180;return (1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*Math.pow(2,z);};
  const x0=Math.floor(lon2x(BBOX.w,Z)),x1=Math.floor(lon2x(BBOX.e,Z)),y0=Math.floor(lat2y(BBOX.n,Z)),y1=Math.floor(lat2y(BBOX.s,Z));
  const cols=(x1-x0+1)*256, rows=(y1-y0+1)*256;
  // pixel offsets of the bbox inside the tile block, so the mesh is cropped to the bbox
  const px0=Math.floor((lon2x(BBOX.w,Z)-x0)*256), px1=Math.floor((lon2x(BBOX.e,Z)-x0)*256);
  const py0=Math.floor((lat2y(BBOX.n,Z)-y0)*256), py1=Math.floor((lat2y(BBOX.s,Z)-y0)*256);

  // location inset: Esri World Topo tile at zoom 5 (covers California and Nevada)
  const IZ=5, ix=Math.floor(lon2x(-119.6,IZ)), iy=Math.floor(lat2y(37.73,IZ));
  document.getElementById('insetImg').src=`https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/${IZ}/${iy}/${ix}`;
  const dot=document.getElementById('insetDot');dot.style.left=((lon2x(-119.6,IZ)-ix)*100)+'%';dot.style.top=((lat2y(37.73,IZ)-iy)*100)+'%';

  // ---------- fetch and decode tiles ----------
  const H=new Float32Array(cols*rows);
  const cv=document.createElement('canvas');cv.width=cv.height=256;const cx=cv.getContext('2d');
  const loadImg=src=>new Promise((res,rej)=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>res(im);im.onerror=()=>rej(new Error(src));im.src=src;});
  const put=(tx,ty,get)=>{for(let j=0;j<256;j++)for(let i=0;i<256;i++)H[((ty-y0)*256+j)*cols+(tx-x0)*256+i]=get(i,j);};
  async function loadEsri(){
    await Lerc.load();
    const jobs=[];
    for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)jobs.push(fetch(ESRI_DEM(Z,tx,ty)).then(r=>{if(!r.ok)throw new Error('tile '+r.status);return r.arrayBuffer();}).then(buf=>{
      const d=Lerc.decode(buf),w=d.width,px=d.pixels[0],m=d.mask;   // Terrain3D tiles are 257 px with a shared edge
      put(tx,ty,(i,j)=>{const k=j*w+i;return (m&&!m[k])?0:px[k];});
    }));
    await Promise.all(jobs);
  }
  async function loadTerrarium(){
    const jobs=[];
    for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)jobs.push(loadImg(TERRARIUM(Z,tx,ty)).then(im=>{
      cx.drawImage(im,0,0);const d=cx.getImageData(0,0,256,256).data;
      put(tx,ty,(i,j)=>{const k=(j*256+i)*4;return (d[k]*256+d[k+1]+d[k+2]/256)-32768;});
    }));
    await Promise.all(jobs);
  }
  let demName='Elevation: Esri World Elevation (Terrain3D).';
  try{
    if(DEM==='esri'){try{await loadEsri();}catch(e){console.warn('Esri DEM failed, falling back to Terrarium',e);await loadTerrarium();demName='Elevation: Mapzen Terrarium (Esri service unavailable).';}}
    else{await loadTerrarium();demName='Elevation: Mapzen Terrarium.';}
  }catch(e){document.getElementById('loading').textContent='Could not load elevation tiles. Check the network and reload.';return;}

  // satellite imagery for the drape: World Imagery tiles, cropped to the bbox
  let imagery=null;
  try{
    const ax0=Math.floor(lon2x(BBOX.w,IMG_Z)),ax1=Math.floor(lon2x(BBOX.e,IMG_Z)),ay0=Math.floor(lat2y(BBOX.n,IMG_Z)),ay1=Math.floor(lat2y(BBOX.s,IMG_Z));
    const block=document.createElement('canvas');block.width=(ax1-ax0+1)*256;block.height=(ay1-ay0+1)*256;const bc=block.getContext('2d');
    const jobs=[];for(let ty=ay0;ty<=ay1;ty++)for(let tx=ax0;tx<=ax1;tx++)jobs.push(loadImg(IMAGERY(IMG_Z,tx,ty)).then(im=>bc.drawImage(im,(tx-ax0)*256,(ty-ay0)*256)));
    await Promise.all(jobs);
    const cx0=(lon2x(BBOX.w,IMG_Z)-ax0)*256,cx1=(lon2x(BBOX.e,IMG_Z)-ax0)*256,cy0=(lat2y(BBOX.n,IMG_Z)-ay0)*256,cy1=(lat2y(BBOX.s,IMG_Z)-ay0)*256;
    imagery=document.createElement('canvas');imagery.width=2048;imagery.height=Math.round(2048*(cy1-cy0)/(cx1-cx0));
    imagery.getContext('2d').drawImage(block,cx0,cy0,cx1-cx0,cy1-cy0,0,0,imagery.width,imagery.height);
  }catch(e){console.warn('Imagery failed, using computed colours',e);imagery=null;}
  document.getElementById('attrib').textContent=demName+(imagery?' Imagery: Esri, Maxar, Earthstar Geographics, and the GIS User Community.':'');

  // ---------- crop and downsample ----------
  const W=Math.floor((px1-px0)/STEP), R=Math.floor((py1-py0)/STEP);
  const h=new Float32Array(W*R);
  for(let j=0;j<R;j++)for(let i=0;i<W;i++)h[j*W+i]=H[(py0+j*STEP)*cols+px0+i*STEP];
  const latMid=(BBOX.n+BBOX.s)/2;
  const cell=40075016.686*Math.cos(latMid*Math.PI/180)/(256*Math.pow(2,Z))*STEP;   // metres per grid cell
  const sx=W*cell/U, sy=R*cell/U;
  const ij=(lon,lat)=>[ (lon-BBOX.w)/(BBOX.e-BBOX.w)*W, (BBOX.n-lat)/(BBOX.n-BBOX.s)*R ];
  const groundAt=(lon,lat)=>{const [i,j]=ij(lon,lat);return h[Math.round(j)*W+Math.round(i)];};
  const toScene=(i,j,e)=>new THREE.Vector3((i/W-0.5)*sx,e*EXAG/U,(j/R-0.5)*sy);

  // ---------- valley mask: which cells are below a level AND connected to the valley floor ----------
  const seed=ij(-119.6350,37.7235);  // El Capitan Meadow
  const mask=new Uint8Array(W*R), stack=new Int32Array(W*R);
  function floodMask(levelAt){
    mask.fill(0);let sp=0;const s0=Math.round(seed[1])*W+Math.round(seed[0]);
    if(h[s0]>=levelAt(s0))return;mask[s0]=1;stack[sp++]=s0;
    while(sp){const k=stack[--sp],i=k%W,j=(k-i)/W;
      const nb=[i>0?k-1:-1,i<W-1?k+1:-1,j>0?k-W:-1,j<R-1?k+W:-1];
      for(const n of nb){if(n>=0&&!mask[n]&&h[n]<levelAt(n)){mask[n]=1;stack[sp++]=n;}}}
  }
  const lonOf=k=>BBOX.w+((k%W)/W)*(BBOX.e-BBOX.w);
  const kmFromEast=k=>(BBOX.e-lonOf(k))*111.32*Math.cos(latMid*Math.PI/180);

  // ---------- scene ----------
  const view=document.getElementById('view');
  const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.domElement.className='gl';renderer.outputEncoding=THREE.sRGBEncoding;view.appendChild(renderer.domElement);
  const scene=new THREE.Scene();scene.background=new THREE.Color(0xE4E9EA);scene.fog=new THREE.Fog(0xE4E9EA,sx*1.6,sx*3.6);
  const camera=new THREE.PerspectiveCamera(46,1,0.5,sx*10);
  const controls=new THREE.OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true;controls.maxPolarAngle=Math.PI*0.47;controls.minDistance=sx*0.12;controls.maxDistance=sx*2.2;
  scene.add(new THREE.HemisphereLight(0xffffff,0x8a8f88,0.8));
  const sun=new THREE.DirectionalLight(0xfff4e0,0.95);sun.position.set(-sx,sx*0.8,sy*0.7);scene.add(sun);

  // terrain, coloured by slope and elevation. Meadow only on the flat valley floor east of the moraine.
  const geo=new THREE.PlaneGeometry(sx,sy,W-1,R-1);const P=geo.attributes.position;
  const col=new Float32Array(W*R*3);
  const cGran=new THREE.Color(0xA3A69F),cGranDk=new THREE.Color(0x767A74),cForest=new THREE.Color(0x4E6A49),cForestHi=new THREE.Color(0x6E8A5E),cMeadow=new THREE.Color(0xA7B77A),cHigh=new THREE.Color(0x848C82);
  const slopeArr=new Float32Array(W*R);
  for(let j=0;j<R;j++)for(let i=0;i<W;i++){
    const k=j*W+i,e=h[k];P.setZ(k,e*EXAG/U);
    const dx=(h[j*W+Math.min(i+1,W-1)]-h[j*W+Math.max(i-1,0)])/(2*cell), dy=(h[Math.min(j+1,R-1)*W+i]-h[Math.max(j-1,0)*W+i])/(2*cell);
    const slope=Math.atan(Math.hypot(dx,dy));slopeArr[k]=slope;
    let c;
    if(slope>0.8)c=cGranDk;else if(slope>0.55)c=cGran;
    else if(e<1300&&slope<0.12&&lonOf(k)>-119.668)c=cMeadow;
    else if(e>2700)c=cHigh;else if(e>2300)c=cForestHi.clone().lerp(cHigh,(e-2300)/400);
    else c=cForest.clone().lerp(cForestHi,Math.max(0,(e-1300)/1000));
    col[k*3]=c.r;col[k*3+1]=c.g;col[k*3+2]=c.b;
  }
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));geo.computeVertexNormals();geo.rotateX(-Math.PI/2);
  let terrainMat;
  if(imagery){const tex=new THREE.CanvasTexture(imagery);tex.anisotropy=renderer.capabilities.getMaxAnisotropy();tex.encoding=THREE.sRGBEncoding;
    terrainMat=new THREE.MeshLambertMaterial({map:tex});}
  else terrainMat=new THREE.MeshLambertMaterial({vertexColors:true});
  scene.add(new THREE.Mesh(geo,terrainMat));

  // ---------- ice / lake surface, coloured by depth so thickness reads ----------
  const fillGeo=new THREE.PlaneGeometry(sx,sy,W-1,R-1);fillGeo.rotateX(-Math.PI/2);
  const fcol=new Float32Array(W*R*3);fillGeo.setAttribute('color',new THREE.BufferAttribute(fcol,3));
  const iceMat=new THREE.MeshPhongMaterial({vertexColors:true,shininess:30,transparent:true,opacity:0.95,side:THREE.DoubleSide});
  const lakeMat=new THREE.MeshPhongMaterial({vertexColors:true,shininess:90,transparent:true,opacity:0.9});
  const fill=new THREE.Mesh(fillGeo,iceMat);fill.visible=false;fill.renderOrder=1;scene.add(fill);
  const FP=fillGeo.attributes.position;
  const iceThin=new THREE.Color(0xEEF4F6),iceThick=new THREE.Color(0x6F98B0),lakeShallow=new THREE.Color(0x6FA3BD),lakeDeep=new THREE.Color(0x1F567A);
  let curLevel=null; // function k -> surface elevation, or null
  function applyFill(levelEast,slopePerKm,westLimitLon,isLake){
    const lv=k=>{const l=levelEast-slopePerKm*kmFromEast(k);return lonOf(k)<westLimitLon?-1e4:l;};
    floodMask(lv);curLevel=lv;
    for(let k=0;k<W*R;k++){
      const on=mask[k]===1,l=lv(k);
      FP.setY(k,(on?l:h[k]-60)*EXAG/U);
      const t=on?Math.min(1,(l-h[k])/(isLake?300:1200)):0;
      const c=isLake?lakeShallow.clone().lerp(lakeDeep,t):iceThin.clone().lerp(iceThick,t);
      fcol[k*3]=c.r;fcol[k*3+1]=c.g;fcol[k*3+2]=c.b;
    }
    FP.needsUpdate=true;fillGeo.attributes.color.needsUpdate=true;fillGeo.computeVertexNormals();
  }

  // ---------- labels (constant screen size, hidden when under the surface) ----------
  function sprite(text,size,color){const c=document.createElement('canvas');c.width=512;c.height=96;const g=c.getContext('2d');
    g.font=`600 ${size}px "IBM Plex Sans", system-ui, sans-serif`;g.textAlign='center';g.lineWidth=8;g.strokeStyle='rgba(243,244,240,.9)';g.strokeText(text,256,62);g.fillStyle=color;g.fillText(text,256,62);
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false,sizeAttenuation:false}));s.scale.set(0.34,0.064,1);s.renderOrder=3;return s;}
  const places=[['El Capitan',-119.6377,37.7340],['Half Dome',-119.5332,37.7459],['Yosemite Falls',-119.5967,37.7566],['Bridalveil Fall',-119.6468,37.7167],['Tioga moraine',-119.6605,37.7175]];
  const labels=places.map(([t,lon,lat])=>{const s=sprite(t,40,'#22302F');const [i,j]=ij(lon,lat);const e=groundAt(lon,lat);
    s.position.copy(toScene(i,j,e+90));s.userData={k:Math.round(j)*W+Math.round(i),e};scene.add(s);return s;});
  function updateLabels(){for(const s of labels){s.visible=!(curLevel&&mask[s.userData.k]&&curLevel(s.userData.k)>s.userData.e+30);}}

  camera.position.set(-sx*0.58,sx*0.24,sy*0.6);controls.target.set(0,12,0);

  // ---------- plan view inset with camera footprint and 1 km bar ----------
  const plan=document.getElementById('plan'),pg=plan.getContext('2d');
  const shade=document.createElement('canvas');shade.width=W;shade.height=R;{const sc=shade.getContext('2d'),im=sc.createImageData(W,R);
    for(let k=0;k<W*R;k++){const v=Math.round(215-slopeArr[k]*120);im.data[k*4]=v;im.data[k*4+1]=v+4;im.data[k*4+2]=v;im.data[k*4+3]=255;}sc.putImageData(im,0,0);}
  function drawPlan(){pg.clearRect(0,0,plan.width,plan.height);pg.drawImage(shade,0,0,plan.width,plan.height);
    const px=(camera.position.x/sx+0.5)*plan.width,py=(camera.position.z/sy+0.5)*plan.height;
    const dir=new THREE.Vector3();camera.getWorldDirection(dir);const a=Math.atan2(dir.z,dir.x),fov=0.45;
    pg.fillStyle='rgba(200,69,43,.28)';pg.beginPath();pg.moveTo(px,py);pg.lineTo(px+Math.cos(a-fov)*160,py+Math.sin(a-fov)*160);pg.lineTo(px+Math.cos(a+fov)*160,py+Math.sin(a+fov)*160);pg.closePath();pg.fill();
    pg.fillStyle='#C8452B';pg.beginPath();pg.arc(Math.min(plan.width-4,Math.max(4,px)),Math.min(plan.height-4,Math.max(4,py)),5,0,7);pg.fill();
    const kmPx=1000/(cell*W)*plan.width;pg.fillStyle='#22302F';pg.fillRect(8,plan.height-16,kmPx,3);pg.font='600 18px system-ui';pg.fillText('1 km',8,plan.height-20);
    document.getElementById('northG').setAttribute('transform',`rotate(${-controls.getAzimuthalAngle()*180/Math.PI} 22 22)`);}

  // ---------- stages ----------
  const S=[
    {bp:'over 2,000,000 BP',title:'Before the ice',
     b1:'The model shows the land as it is now, so you have to imagine this stage. Long ago the Sierra Nevada was pushed up. That made the Merced River run faster and cut down into the hard granite.',
     b2:'It cut a deep, narrow canyon shaped like a V. There was no flat floor and no waterfalls yet. The <a class="xs" href="yosemite-valley.html">cross-section</a> shows this stage.',
     look:['Follow the Merced River west out of the valley. Its canyon there was never under ice. It is still a V.']},
    {ice:{level:2250,slope:12,west:-180},bp:'about 1,000,000 BP',title:'Sherwin glaciation',
     b1:'Watch the ice rise. The whole valley fills up. The ice is about 1,500 m thick. Only the tops of El Capitan and Half Dome stick out.',
     b2:'Ice this thick does not flow along the floor like a river. It fills the valley from wall to wall and grinds every surface. This ice did most of the shaping.',
     look:['Find the rounded domes above the valley, like Sentinel Dome. Ice flowed right over them.']},
    {ice:{level:1760,slope:18,west:-119.662},bp:'about 20,000 BP',title:'Tioga glaciation',
     b1:'The last glacier was smaller, about 500 m thick. It stopped near Bridalveil Meadow and left a ridge of rock and gravel there. That ridge is called a moraine.',
     b2:'The upper walls stayed above the ice. The valley already had its U shape. This glacier polished the floor.',
     look:['Find the low ridge across the valley west of El Capitan. That is the moraine.']},
    {ice:{level:1228,slope:0,west:-119.664},lake:true,bp:'about 15,000 BP',title:'Lake Yosemite',
     b1:'The glacier melted. The moraine held the water back like a dam, and a lake filled the valley.',
     b2:'Streams from the side valleys now fell straight into the lake. Those are the waterfalls. Slowly the lake filled up with sand and mud.',
     look:['Look at Yosemite Falls. Trace the creek above it. Its valley stops at the edge and drops off.']},
    {bp:'0 BP',title:'Today',
     b1:'The lake is gone. Its mud and sand make the flat floor, about 1,200 m above the sea. Under the meadows there is up to 600 m of it before you reach rock.',
     b2:'The walls rise almost 1,000 m straight up. Turn the model and look at the sharp edge between floor and wall.',
     look:['Measure from El Capitan Meadow (about 1,200 m) to the top of El Capitan (2,307 m).','Turn on the land cover layer. Forest and meadow on the floor, bare rock on the walls.']}
  ];
  const $=id=>document.getElementById(id);let cur=4,anim=null;
  const XS=qs.get('xs')||'yosemite-valley.html';   // ?xs=<url> if the cross-section page lives elsewhere
  $('xsLink').href=XS;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function go(i){
    cur=i;const s=S[i];cancelAnimationFrame(anim);
    if(s.ice){
      fill.material=s.lake?lakeMat:iceMat;fill.visible=true;
      const from=1150,t0=performance.now(),dur=reduce?0:(s.lake?1500:3200);
      const step=now=>{const t=dur?Math.min(1,(now-t0)/dur):1,e=1-Math.pow(1-t,2);
        applyFill(from+(s.ice.level-from)*e,s.ice.slope*e,s.ice.west,!!s.lake);updateLabels();if(t<1)anim=requestAnimationFrame(step);};
      anim=requestAnimationFrame(step);
    }else{fill.visible=false;curLevel=null;updateLabels();}
    $('title').textContent=s.title;$('b1').textContent=s.b1;$('b2').innerHTML=s.b2;
    $('look').innerHTML=s.look.map(t=>`<li>${t}</li>`).join('');document.querySelectorAll('a.xs').forEach(a=>a.href=XS);
    document.querySelectorAll('.stages button').forEach(b=>b.setAttribute('aria-current',b.dataset.s==i?'true':'false'));
  }
  document.querySelectorAll('.stages button').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.s)));
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&cur<S.length-1)go(cur+1);if(e.key==='ArrowLeft'&&cur>0)go(cur-1);});
  function resize(){const w=view.clientWidth,ht=view.clientHeight;renderer.setSize(w,ht,false);camera.aspect=w/ht;camera.updateProjectionMatrix();}
  addEventListener('resize',resize);resize();$('loading').remove();go(4);
  (function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera);drawPlan();})();
})();
</script>
